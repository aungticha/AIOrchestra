name: Local dashboard tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --check static/pixel_office.js
      - run: node tests/test_office_state.cjs
      - run: node --check static/office_motion.js
      - run: node tests/test_office_motion.cjs
      - run: node --check static/terminal.js
      - run: node --check static/community.js
      - run: node --check static/workflow.js
