<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Orchestra · Local agent workspace</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/vendor/xterm.css"></head>
<body><aside><a class="brand" href="/">◈ <span>AI Orchestra<small>LOCAL WORKSPACE</small></span></a><div class="nav-label">WORKSPACE</div><button class="nav active" id="home">▦ &nbsp; ทีมทั้งหมด <span id="teamCount">0</span></button><details class="sidebar-group" id="workflowGroup" data-sidebar-group="workflow"><summary class="sidebar-summary">⇄ <span>Workflow</span></summary><div class="sidebar-children"><button class="nav" id="workflowNav">จัดการ Workflow</button><button class="nav" id="workflowConsoleNav">งานที่รัน / Console <span id="wfRunningCount">0</span></button></div></details><details class="sidebar-group" id="settingsGroup" data-sidebar-group="settings"><summary class="sidebar-summary">⚙ <span>การตั้งค่า</span></summary><div class="sidebar-children"><button class="nav" id="setupNav">Setup AI Clients</button><button class="nav" id="credentialsNav">API Keys กลาง</button></div></details><div class="nav-label">YOUR TEAMS</div><nav id="teamNav"></nav><div class="local"><i></i> Local-first, Markdown-native<small>ไฟล์ของคุณ อยู่บนเครื่องของคุณ</small></div></aside><main><header><span>Workspace <b>/</b> <span id="crumb">Overview</span></span><span class="badge">● &nbsp; LOCAL ONLY</span></header><div id="content"></div></main><dialog id="modal"><form id="createForm"><div class="dialog-head"><h2 id="dialogTitle">สร้างทีมใหม่</h2><button type="button" id="closeModal" class="icon" aria-label="ปิด">×</button></div><p id="dialogHint"></p><label>ID <input name="id" required maxlength="128" placeholder="ตั้ง ID ทีมได้เอง เช่น ทีมค้นคว้า 01 หรือ Studio A" autocomplete="off"></label><label id="titleLabel"><span id="titleLabelText">ชื่อ / คำอธิบาย</span> <input name="title" required placeholder="ชื่อหรือหน้าที่ของทีม"></label><label id="teamDescriptionLabel">Description ของทีม<textarea name="description" id="teamDescription" maxlength="4000" placeholder="อธิบายว่าทีมนี้ทำอะไร ขอบเขตงาน และสิ่งที่ส่งมอบ"></textarea></label><div id="agentCreateFields" hidden><label>Role / บทบาท<input name="agentRole" id="agentRole" maxlength="200" placeholder="เช่น Developer, Researcher, Tester"></label><label>Description / เมื่อใดควรใช้ Agent<input name="agentDescription" id="agentDescription" maxlength="2000" placeholder="เช่น ใช้เมื่อต้องพัฒนาโค้ดและแก้บั๊ก"></label></div><label>Template · ประเภทงาน <select name="template" id="workTemplate"></select></label><label>แนวทางเลือกโมเดล <select name="routingMode" id="routingMode"><option value="recommended">Recommended · ค่าแนะนำจาก Template</option><option value="auto">Auto · ใช้ประเภทงานเป็นเงื่อนไขเลือก</option></select></label><div id="templateDetails" class="template-details"></div><p class="muted">สร้างแล้วสามารถแก้ไข Markdown และรายละเอียดทั้งหมดได้</p><button class="primary" type="submit">สร้างและเปิดแก้ไข →</button><p id="formError" role="alert"></p></form></dialog><dialog id="manageModal"><form id="manageForm"><div class="dialog-head"><h2 id="manageTitle"></h2><button type="button" id="cancelManage" class="icon" aria-label="ปิดการจัดการ">×</button></div><p id="manageHint"></p><label id="manageNameLabel">ชื่อใหม่<input id="manageName" autocomplete="off"></label><div id="manageProfileFields" hidden><label>ชื่อ Agent ที่แสดง<input id="manageDisplayName" maxlength="200" placeholder="เช่น ไอซ์"></label><label>Role / บทบาท<input id="manageRole" maxlength="200" placeholder="เช่น Developer"></label><label>Description / เมื่อใดควรใช้<input id="manageAgentDescription" maxlength="2000" placeholder="สรุปหน้าที่และงานที่ควรเลือก Agent นี้"></label></div><label id="manageDescriptionLabel">Description ของทีม<textarea id="manageDescription" maxlength="4000"></textarea></label><label id="closeRunConfirmLabel" class="close-run-confirm"><input type="checkbox" id="closeRunConfirm"> ฉันหยุดงานใน CLI แล้ว</label><p id="manageError" class="credential-error" role="alert"></p><button id="submitManage" class="primary" type="submit">บันทึก</button></form></dialog><div id="toast" role="status"></div><script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script><script src="/terminal.js"></script><script src="/office_state.js"></script><script src="/office_motion.js"></script><script src="/pixel_office.js"></script><script src="/app.js"></script><script src="/community.js"></script><script src="/workflow.js"></script></body></html>
